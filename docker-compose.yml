services:
  db-studio:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "3030:3030"
    environment:
      - NODE_ENV=production
      - FORCE_READ_ONLY=false
      - RATE_LIMIT_MAX_REQUESTS=100
      - AUDIT_LOG_ENABLED=true
    restart: unless-stopped
    # Resource limits to prevent system crash
    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 256M

  # Optional: PostgreSQL for testing
  postgres:
    image: postgres:16-alpine
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: testdb
    volumes:
      - postgres_data:/var/lib/postgresql/data
    profiles:
      - with-db

  # Optional: MySQL for testing
  mysql:
    # Pinned to the LTS series: 8.4 dropped --default-authentication-plugin and
    # disabled mysql_native_password, so an unpinned `mysql:8` changes the
    # server's auth defaults underneath the fixture. The driver authenticates
    # with caching_sha2_password, which needs no override either way.
    image: mysql:8.4
    ports:
      - "3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: mysql
      MYSQL_DATABASE: testdb
      MYSQL_USER: mysql
      MYSQL_PASSWORD: mysql
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-pmysql"]
      interval: 5s
      timeout: 5s
      retries: 20
    profiles:
      - with-db

  # Optional: MongoDB for testing
  mongodb:
    image: mongo:7
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: mongo
      MONGO_INITDB_ROOT_PASSWORD: mongo
    volumes:
      - mongo_data:/data/db
    profiles:
      - with-db

  # Optional: ClickHouse for testing
  clickhouse:
    image: clickhouse/clickhouse-server:24
    ports:
      - "8123:8123"   # HTTP interface
      - "9000:9000"   # Native interface
    environment:
      CLICKHOUSE_USER: default
      CLICKHOUSE_PASSWORD: clickhouse
      CLICKHOUSE_DB: default
    volumes:
      - clickhouse_data:/var/lib/clickhouse
    profiles:
      - with-db

  # Optional: Redis for testing
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    command: redis-server --save "" --appendonly no
    profiles:
      - with-db

volumes:
  postgres_data:
  mysql_data:
  mongo_data:
  clickhouse_data:
